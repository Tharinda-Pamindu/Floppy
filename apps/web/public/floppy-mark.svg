    <mask id="floppy-f">
      <rect x="-4" y="-4" width="108" height="128" fill="#fff"/>
      <path fill="#000" d="M23 126V66A17 17 0 0 1 40 49H80.5A1.5 1.5 0 0 1 81.6 51.5L71 64H40A10 10 0 0 0 30 74V77H58A8 8 0 0 1 58 93H40A10 10 0 0 0 30 103V126Z"/>
    </mask>
  </defs>
  <g fill="#FF5722">
    <path mask="url(#floppy-f)" d="M25 0H61V26A13 13 0 0 0 74 39H100V82Q100 99 84 105L30 120H25A25 25 0 0 1 0 95V25A25 25 0 0 1 25 0Z"/>
    <path d="M66 1V23A12 12 0 0 0 78 35H100Z"/>
