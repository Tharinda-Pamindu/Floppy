<svg xmlns="http://www.w3.org/2000/svg" viewBox="-4 -4 108 128" role="img" aria-label="Floppy">
  <!-- Floppy mark: a document-shaped disk with a folded corner and an F cut
       out of it. The F and the gap around the fold are holes, not white
       paint, so the mark sits on light and dark backgrounds alike. -->
