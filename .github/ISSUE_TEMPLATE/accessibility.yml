name: Accessibility issue
description: Something is hard or impossible to use with a keyboard, screen reader, zoom or other assistive technology.
title: "Accessibility: "
labels: ["accessibility", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for telling us. If you'd rather not describe this in public, use the "Ask a maintainer to contact me privately" template instead: it asks for no details, and a maintainer will reach out privately. See ACCESSIBILITY.md.
  - type: input
    id: page
    attributes:
      label: Page or feature
      placeholder: Tasks → Board
    validations:
      required: true
  - type: textarea
    id: barrier
    attributes:
      label: What were you trying to do, and what got in the way?
      placeholder: I can't move a card to "In review" using only the keyboard; focus skips the card's menu.
    validations:
      required: true
  - type: input
    id: technology
    attributes:
      label: Assistive technology, browser and operating system
      placeholder: NVDA 2024.4 with Firefox 133 on Windows 11
    validations:
      required: true
  - type: dropdown
    id: impact
    attributes:
      label: How much does this block you?
      options:
        - I can't complete the task at all
        - I can complete it, but with real difficulty
        - It's an annoyance
    validations:
      required: true
  - type: textarea
    id: wcag
    attributes:
      label: WCAG success criterion (optional)
      description: If you know which WCAG 2.2 criterion this fails, name it.
      placeholder: 2.1.1 Keyboard
